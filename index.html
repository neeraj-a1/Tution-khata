<script>
const { useState, useEffect, useRef } = React;
const h = React.createElement;

// ====================================================================
const SUPABASE_URL = 'https://xgsbjyqdkeaeihzhadgs.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_vP7cJ9AA9Ubf5dVu_WxEkg_fuymQNU5';
// ====================================================================

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const COLORS = {
  paper: '#E7E6D9', paperLight: '#F4F3EA', ink: '#1E2A3A',
  inkSoft: '#5C6357', redInk: '#A6321F', greenInk: '#2F6B3A', border: '#C9C7B4',
};

function monthKey(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(k) { const parts = k.split('-').map(Number); return MONTHS[parts[1]-1] + ' ' + parts[0]; }
function formatDate(iso) { return new Date(iso).toLocaleDateString('en-IN',{day:'numeric',month:'short'}); }

function monthsBetweenInclusive(startKey, endKey) {
  const s = startKey.split('-').map(Number);
  const e = endKey.split('-').map(Number);
  const out = [];
  let y = s[0], m = s[1];
  while (y < e[0] || (y === e[0] && m <= e[1])) {
    out.push(y + '-' + String(m).padStart(2, '0'));
    m++;
    if (m > 12) { m = 1; y++; }
  }
  return out;
}

function studentMonths(member) {
  const startKey = member.joined_month || monthKey(new Date(member.created_at));
  const endKey = monthKey(new Date());
  return monthsBetweenInclusive(startKey, endKey);
}

function outstandingMonths(member, payments) {
  return studentMonths(member).filter(function(mk) {
    const p = payments[member.id + '_' + mk];
    return !(p && p.paid);
  });
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 700;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.55));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function compressPhoto(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const size = 200;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const scale = Math.max(size / img.width, size / img.height);
        const w = img.width * scale, hgt = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - hgt) / 2, w, hgt);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function Stamp(props) {
  const paid = props.paid;
  const label = props.label || (paid ? 'Paid' : 'Pending');
  return h('div', {
    style: {
      color: paid ? COLORS.greenInk : COLORS.redInk,
      border: '2.5px double ' + (paid ? COLORS.greenInk : COLORS.redInk),
      transform: paid ? 'rotate(-6deg)' : 'rotate(4deg)',
      fontFamily: "'Arvo', serif",
      whiteSpace: 'nowrap',
    },
    className: 'px-2 py-0.5 text-[11px] font-bold tracking-widest uppercase rounded-sm select-none'
  }, label);
}

function App() {
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [tutorId, setTutorId] = useState(null);
  const [profile, setProfile] = useState(null);
  const [members, setMembers] = useState([]);
  const [payments, setPayments] = useState({});
  const [showAdd, setShowAdd] = useState(false);
  const [editingMember, setEditingMember] = useState(null);
  const [viewMode, setViewMode] = useState('cards');
  const [markPaidFor, setMarkPaidFor] = useState(null);
  const [expandedHistory, setExpandedHistory] = useState(null);
  const [lightbox, setLightbox] = useState(null);
  const [remindQueue, setRemindQueue] = useState(null);
  const [searchQuery, setSearchQuery] = useState('');
  const [error, setError] = useState('');
  const [installPrompt, setInstallPrompt] = useState(null);

  useEffect(() => {
    function handler(e) {
      e.preventDefault();
      setInstallPrompt(e);
    }
    window.addEventListener('beforeinstallprompt', handler);
    return function() { window.removeEventListener('beforeinstallprompt', handler); };
  }, []);

  function handleInstallClick() {
    if (!installPrompt) return;
    installPrompt.prompt();
    installPrompt.userChoice.then(function() { setInstallPrompt(null); });
  }

  useEffect(() => {
    const savedId = localStorage.getItem('tutor_id');
    if (savedId) { setTutorId(savedId); loadData(savedId); }
    else { setLoading(false); }
  }, []);

  async function loadData(id) {
    setLoading(true);
    const t = await sb.from('tutors').select('*').eq('id', id).single();
    if (t.data) setProfile(t.data);
    const m = await sb.from('members').select('*').eq('tutor_id', id);
    const mem = m.data || [];
    setMembers(mem);
    if (mem.length) {
      const ids = mem.map(x => x.id);
      const p = await sb.from('payments').select('*').in('member_id', ids);
      const map = {};
      (p.data || []).forEach(pay => { map[pay.member_id + '_' + pay.month] = pay; });
      setPayments(map);
    }
    setLoading(false);
  }

  async function createTutor(name, upi, pin) {
    setSaving(true);
    const res = await sb.from('tutors').insert({ name: name, upi_id: upi, recovery_pin: pin }).select().single();
    if (res.error) { setError('Could not create your register. Please try again.'); setSaving(false); return; }
    localStorage.setItem('tutor_id', res.data.id);
    setTutorId(res.data.id);
    setProfile(res.data);
    setSaving(false);
  }

  async function recoverAccount(upi, pin) {
    const res = await sb.from('tutors').select('*').eq('upi_id', upi.trim()).eq('recovery_pin', pin.trim()).maybeSingle();
    if (res.error) return 'Something went wrong. Please try again.';
    if (!res.data) return 'No matching account found. Check your UPI ID and PIN are exactly right.';
    localStorage.setItem('tutor_id', res.data.id);
    setTutorId(res.data.id);
    await loadData(res.data.id);
    return null;
  }

  async function addMember(name, phone, fee, joinedMonth, photo, studentClass, parentName) {
    const res = await sb.from('members')
      .insert({ tutor_id: tutorId, name: name, phone: phone, fee: Number(fee), joined_month: joinedMonth, photo: photo, student_class: studentClass, parent_name: parentName }).select().single();
    if (res.error) { return res.error.message || 'Could not add student.'; }
    setMembers(members.concat([res.data]));
    setShowAdd(false);
    return null;
  }

  async function editMember(memberId, name, phone, fee, photo, studentClass, parentName) {
    const updates = { name: name, phone: phone, fee: Number(fee), student_class: studentClass, parent_name: parentName };
    if (photo !== undefined) updates.photo = photo;
    const res = await sb.from('members')
      .update(updates).eq('id', memberId).select().single();
    if (res.error) { return res.error.message || 'Could not update student.'; }
    setMembers(members.map(m => m.id === memberId ? res.data : m));
    setEditingMember(null);
    return null;
  }

  function buildUpiLink(member, amount) {
    const params = new URLSearchParams({
      pa: profile.upi_id, pn: profile.name, am: String(amount), cu: 'INR', tn: 'Tuition fee'
    });
    return 'upi://pay?' + params.toString();
  }

  function sendReminder(member) {
    const outstanding = outstandingMonths(member, payments);
    if (outstanding.length === 0) return;
    const total = outstanding.length * Number(member.fee);
    const monthsList = outstanding.map(monthLabel).join(', ');
    const upiLink = buildUpiLink(member, total);
    const breakdown = outstanding.length > 1
      ? ' (' + outstanding.length + ' months \u00d7 Rs.' + member.fee + ')'
      : '';
    const msg = "Hi! This is a reminder for " + member.name + "'s tuition fee.\n\nPending: " + monthsList +
      "\nTotal due: Rs." + total + breakdown +
      "\n\nPay here: " + upiLink + "\n\nKindly share a screenshot after payment for our records. Thank you!\n\n\u2014 sent via Tuition Khata";
    const digits = member.phone.replace(/\D/g, '');
    const waPhone = digits.length === 10 ? '91' + digits : digits;
    window.open('https://wa.me/' + waPhone + '?text=' + encodeURIComponent(msg), '_blank');
  }

  async function handleMarkPaid(memberId, monthsToMark, file) {
    setSaving(true);
    let screenshot = null;
    try { if (file) screenshot = await compressImage(file); } catch (e) {}
    const now = new Date().toISOString();
    const next = Object.assign({}, payments);
    for (let i = 0; i < monthsToMark.length; i++) {
      const mk = monthsToMark[i];
      const res = await sb.from('payments')
        .upsert({ member_id: memberId, month: mk, paid: true, screenshot: screenshot, paid_at: now },
          { onConflict: 'member_id,month' }).select().single();
      if (!res.error) next[memberId + '_' + mk] = res.data;
    }
    setPayments(next);
    setSaving(false);
    setMarkPaidFor(null);
  }

  function sendReceipt(member, mk, payment) {
    const msg = "\u2705 Payment Received\n\nStudent: " + member.name + "\nMonth: " + monthLabel(mk) +
      "\nAmount: Rs." + member.fee + "\nReceived on: " + formatDate(payment.paid_at) +
      "\n\nThank you!\n\u2014 " + profile.name + " (via Tuition Khata)";
    const digits = member.phone.replace(/\D/g, '');
    const waPhone = digits.length === 10 ? '91' + digits : digits;
    window.open('https://wa.me/' + waPhone + '?text=' + encodeURIComponent(msg), '_blank');
  }

  async function unmarkPaid(memberId, mk) {
    await sb.from('payments').delete().eq('member_id', memberId).eq('month', mk);
    const next = Object.assign({}, payments);
    delete next[memberId + '_' + mk];
    setPayments(next);
  }

  if (loading) {
    return h('div', { style: { backgroundColor: COLORS.paper }, className: 'min-h-screen flex items-center justify-center font-sans' },
      h('span', { style: { color: COLORS.inkSoft } }, 'Loading\u2026')
    );
  }

  const errorBox = error ? h('div', { style: { color: COLORS.redInk }, className: 'text-sm mb-4' }, error) : null;

  const emptyState = h('div', { style: { borderColor: COLORS.border, color: COLORS.inkSoft }, className: 'border border-dashed rounded-lg py-10 px-4 text-center mb-5' },
    h('p', { className: 'text-sm' }, 'No entries yet.', h('br'), 'Add your first student to begin your register.')
  );

  const filteredMembers = members.filter(function(m) {
    const q = searchQuery.trim().toLowerCase();
    if (!q) return true;
    return (m.name && m.name.toLowerCase().indexOf(q) >= 0) ||
      (m.student_class && m.student_class.toLowerCase().indexOf(q) >= 0) ||
      (m.parent_name && m.parent_name.toLowerCase().indexOf(q) >= 0) ||
      (m.phone && m.phone.indexOf(q) >= 0);
  });

  const memberCards = h('div', { className: 'space-y-3 mb-5' },
    filteredMembers.map((m) => {
      const outstanding = outstandingMonths(m, payments);
      const allMonths = studentMonths(m).slice().reverse();
      const totalDue = outstanding.length * Number(m.fee);
      const isExpanded = expandedHistory === m.id;
      const statusLabel = outstanding.length === 0 ? 'All paid' : (outstanding.length + ' month' + (outstanding.length > 1 ? 's' : '') + ' due');

      const historyPanel = isExpanded ? h('div', { className: 'mt-3 pt-3 border-t space-y-1.5', style: { borderColor: COLORS.border } },
        allMonths.map(function(mk) {
          const p = payments[m.id + '_' + mk];
          const isPaid = !!(p && p.paid);
          return h('div', { key: mk, className: 'flex items-center justify-between text-xs' },
            h('span', { style: { color: COLORS.inkSoft } }, monthLabel(mk)),
            isPaid
              ? h('div', { className: 'flex items-center gap-2' },
                  p.screenshot ? h('button', { onClick: () => setLightbox(p.screenshot) },
                    h('img', { src: p.screenshot, className: 'w-6 h-6 object-cover rounded border', style: { borderColor: COLORS.border } })
                  ) : null,
                  h('span', { style: { color: COLORS.greenInk } }, 'Paid ' + formatDate(p.paid_at)),
                  h('button', { onClick: () => sendReceipt(m, mk, p), style: { color: COLORS.inkSoft }, className: 'hover:underline' }, 'Send receipt'),
                  h('button', { onClick: () => unmarkPaid(m.id, mk), style: { color: COLORS.inkSoft }, className: 'hover:underline' }, 'Undo')
                )
              : h('span', { style: { color: COLORS.redInk } }, 'Pending')
          );
        })
      ) : null;

      return h('div', { key: m.id, style: { backgroundColor: COLORS.paperLight, borderColor: COLORS.border }, className: 'rounded-lg border p-4' },
        h('div', { className: 'flex items-start justify-between mb-1' },
          h('div', { className: 'flex items-center gap-3' },
            m.photo ? h('img', { src: m.photo, className: 'w-10 h-10 rounded-full object-cover', style: { border: '1px solid ' + COLORS.border } }) : null,
            h('div', null,
              h('div', { className: 'flex items-center gap-2' },
                h('p', { className: 'font-semibold text-[15px]' }, m.name),
                h('button', { onClick: () => setEditingMember(m), style: { color: COLORS.inkSoft }, className: 'text-xs hover:underline' }, 'Edit')
              ),
              h('p', { style: { fontFamily: "'IBM Plex Mono', monospace", color: COLORS.inkSoft }, className: 'text-xs mt-0.5' }, '+91 ' + m.phone),
              (m.student_class || m.parent_name) ? h('p', { style: { color: COLORS.inkSoft }, className: 'text-xs mt-0.5' },
                [m.student_class, m.parent_name].filter(Boolean).join(' \u2022 ')
              ) : null
            )
          ),
          h(Stamp, { paid: outstanding.length === 0, label: statusLabel })
        ),
        h('p', { style: { fontFamily: "'IBM Plex Mono', monospace" }, className: 'text-lg font-medium mt-2' },
          '\u20B9' + Number(m.fee).toLocaleString('en-IN'),
          h('span', { style: { color: COLORS.inkSoft }, className: 'text-xs font-normal font-sans' }, ' / month')
        ),
        outstanding.length > 0 ? h('p', { style: { color: COLORS.redInk }, className: 'text-xs font-medium mb-3' },
          'Total due: \u20B9' + totalDue.toLocaleString('en-IN') + (outstanding.length > 1 ? ' (' + outstanding.length + ' months)' : '')
        ) : h('div', { className: 'mb-3' }),
        outstanding.length > 0
          ? h('div', { className: 'flex gap-2' },
              h('button', { onClick: () => sendReminder(m), style: { backgroundColor: COLORS.ink, color: COLORS.paperLight }, className: 'flex-1 rounded-md py-2 text-xs font-medium' }, 'Remind on WhatsApp'),
              h('button', { onClick: () => setMarkPaidFor(m.id), style: { borderColor: COLORS.ink, color: COLORS.ink }, className: 'flex-1 rounded-md py-2 text-xs font-medium border' }, 'Mark Paid')
            )
          : null,
        h('button', {
          onClick: () => setExpandedHistory(isExpanded ? null : m.id),
          style: { color: COLORS.inkSoft },
          className: 'text-xs mt-3 hover:underline'
        }, isExpanded ? 'Hide history' : 'View history'),
        historyPanel
      );
    })
  );

  const tableView = h('div', { style: { backgroundColor: COLORS.paperLight, borderColor: COLORS.border }, className: 'rounded-lg border mb-5 overflow-hidden' },
    h('table', { className: 'w-full text-sm' },
      h('thead', null,
        h('tr', { style: { borderColor: COLORS.border }, className: 'border-b' },
          h('th', { className: 'text-left px-3 py-2 font-medium' }, 'Student'),
          h('th', { className: 'text-right px-3 py-2 font-medium' }, 'Fee'),
          h('th', { className: 'text-right px-3 py-2 font-medium' }, 'Due')
        )
      ),
      h('tbody', null,
        filteredMembers.map(function(m, i) {
          const outstanding = outstandingMonths(m, payments);
          const totalDue = outstanding.length * Number(m.fee);
          return h('tr', { key: m.id, style: { borderColor: COLORS.border }, className: i < filteredMembers.length - 1 ? 'border-b' : '' },
            h('td', { className: 'px-3 py-2' },
              h('div', { className: 'flex items-center gap-2' },
                m.photo ? h('img', { src: m.photo, className: 'w-6 h-6 rounded-full object-cover', style: { border: '1px solid ' + COLORS.border } }) : null,
                h('div', null,
                  h('div', { className: 'font-medium' }, m.name),
                  h('div', { style: { color: COLORS.inkSoft, fontFamily: "'IBM Plex Mono', monospace" }, className: 'text-xs' }, '+91 ' + m.phone)
                )
              )
            ),
            h('td', { style: { fontFamily: "'IBM Plex Mono', monospace" }, className: 'text-right px-3 py-2' }, '\u20B9' + Number(m.fee).toLocaleString('en-IN')),
            h('td', { className: 'text-right px-3 py-2' },
              outstanding.length === 0
                ? h('span', { style: { color: COLORS.greenInk }, className: 'text-xs font-medium' }, 'All paid')
                : h('span', { style: { color: COLORS.redInk, fontFamily: "'IBM Plex Mono', monospace" }, className: 'text-xs font-medium' }, '\u20B9' + totalDue.toLocaleString('en-IN'))
            )
          );
        })
      )
    )
  );

  const pendingCount = members.filter(m => outstandingMonths(m, payments).length > 0).length;

  const remindAllButton = pendingCount > 0 ? h('button', {
    onClick: () => setRemindQueue(members.filter(m => outstandingMonths(m, payments).length > 0)),
    style: { backgroundColor: COLORS.redInk, color: COLORS.paperLight },
    className: 'w-full rounded-lg py-2.5 text-sm font-medium mb-4'
  }, '\uD83D\uDCAC Remind All Pending (' + pendingCount + ')') : null;

  const searchBox = members.length > 5 ? h('input', {
    value: searchQuery,
    onChange: e => setSearchQuery(e.target.value),
    placeholder: 'Search by name, class, or parent\u2026',
    style: { borderColor: COLORS.border },
    className: 'w-full border rounded-md px-3 py-2 text-sm mb-4 bg-white/60'
  }) : null;

  const viewToggle = h('div', { className: 'flex gap-2 mb-4' },
    h('button', {
      onClick: () => setViewMode('cards'),
      style: viewMode === 'cards' ? { backgroundColor: COLORS.ink, color: COLORS.paperLight } : { color: COLORS.inkSoft, borderColor: COLORS.border },
      className: 'px-3 py-1.5 rounded-md text-xs font-medium' + (viewMode !== 'cards' ? ' border' : '')
    }, 'Cards'),
    h('button', {
      onClick: () => setViewMode('table'),
      style: viewMode === 'table' ? { backgroundColor: COLORS.ink, color: COLORS.paperLight } : { color: COLORS.inkSoft, borderColor: COLORS.border },
      className: 'px-3 py-1.5 rounded-md text-xs font-medium' + (viewMode !== 'table' ? ' border' : '')
    }, 'Table \u2014 all at a glance')
  );

  const mainContent = !profile
    ? h(Onboarding, { onSave: createTutor, onRecover: recoverAccount, saving: saving, colors: COLORS })
    : h(React.Fragment, null,
        errorBox,
        members.length === 0 ? emptyState : h(React.Fragment, null,
          remindAllButton,
          searchBox,
          viewToggle,
          viewMode === 'table' ? tableView : memberCards
        ),
        h('button', { onClick: () => setShowAdd(true), style: { borderColor: COLORS.ink, color: COLORS.ink }, className: 'w-full border border-dashed rounded-lg py-3 text-sm font-medium' }, '+ Add Student')
      );

  const markPaidMember = markPaidFor ? members.find(x => x.id === markPaidFor) : null;
  const markPaidOutstanding = markPaidMember ? outstandingMonths(markPaidMember, payments) : [];

  return h('div', { style: { backgroundColor: COLORS.paper, color: COLORS.ink }, className: 'min-h-screen font-sans' },
    h('div', { className: 'max-w-md mx-auto px-4 pb-24 pt-6' },
      h('div', { className: 'flex items-center gap-2 mb-1' },
        h('span', { className: 'text-2xl' }, '\uD83D\uDCD6'),
        h('h1', { style: { fontFamily: "'Arvo', serif" }, className: 'text-2xl font-bold tracking-tight' }, 'Tuition Khata')
      ),
      h('p', { style: { color: COLORS.inkSoft }, className: 'text-sm mb-6 ml-8' }, 'your fee register'),
      installPrompt ? h('button', {
        onClick: handleInstallClick,
        style: { backgroundColor: COLORS.ink, color: COLORS.paperLight },
        className: 'w-full rounded-lg py-2.5 text-sm font-medium mb-5'
      }, '\uD83D\uDCF2 Install App on this device') : null,
      mainContent
    ),
    showAdd ? h(AddMemberModal, { onClose: () => setShowAdd(false), onAdd: addMember, colors: COLORS }) : null,
    editingMember ? h(EditMemberModal, { member: editingMember, onClose: () => setEditingMember(null), onSave: editMember, colors: COLORS }) : null,
    remindQueue ? h(RemindAllModal, { queue: remindQueue, onClose: () => setRemindQueue(null), onSend: sendReminder, colors: COLORS }) : null,
    markPaidFor ? h(MarkPaidModal, {
      onClose: () => setMarkPaidFor(null),
      saving: saving,
      outstandingMonths: markPaidOutstanding,
      onConfirm: (monthsToMark, file) => handleMarkPaid(markPaidFor, monthsToMark, file),
      colors: COLORS
    }) : null,
    lightbox ? h('div', { className: 'fixed inset-0 bg-black/80 flex items-center justify-center p-6 z-50', onClick: () => setLightbox(null) },
      h('img', { src: lightbox, className: 'max-w-full max-h-full rounded-lg' })
    ) : null
  );
}

function RemindAllModal(props) {
  const queue = props.queue, onClose = props.onClose, onSend = props.onSend, colors = props.colors;
  const [index, setIndex] = useState(0);
  const done = index >= queue.length;
  const current = !done ? queue[index] : null;

  function handleSendAndNext() {
    onSend(current);
    setIndex(index + 1);
  }
  function handleSkip() {
    setIndex(index + 1);
  }

  return h('div', { className: 'fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center z-50 p-4' },
    h('div', { style: { backgroundColor: colors.paperLight }, className: 'w-full max-w-md rounded-xl p-5' },
      h('div', { className: 'flex items-center justify-between mb-4' },
        h('p', { style: { fontFamily: "'Arvo', serif" }, className: 'font-bold' }, done ? 'All done' : ('Reminder ' + (index + 1) + ' of ' + queue.length)),
        h('button', { onClick: onClose }, '\u2715')
      ),
      done
        ? h('div', { className: 'text-center py-6' },
            h('p', { style: { color: colors.inkSoft }, className: 'text-sm mb-4' }, 'You\u2019ve gone through everyone with dues pending.'),
            h('button', {
              onClick: onClose,
              style: { backgroundColor: colors.ink, color: colors.paperLight },
              className: 'rounded-md py-2.5 px-6 text-sm font-medium'
            }, 'Close')
          )
        : h(React.Fragment, null,
            h('div', { className: 'flex flex-col items-center mb-5' },
              current.photo ? h('img', { src: current.photo, className: 'w-16 h-16 rounded-full object-cover mb-2', style: { border: '1px solid ' + colors.border } }) : null,
              h('p', { className: 'font-semibold text-lg' }, current.name),
              h('p', { style: { color: colors.inkSoft }, className: 'text-xs' }, '+91 ' + current.phone)
            ),
            h('button', {
              onClick: handleSendAndNext,
              style: { backgroundColor: colors.ink, color: colors.paperLight },
              className: 'w-full rounded-md py-3 text-sm font-medium mb-2'
            }, '\uD83D\uDCAC Open WhatsApp & Next'),
            h('button', {
              onClick: handleSkip,
              style: { color: colors.inkSoft },
              className: 'w-full text-xs py-2 hover:underline'
            }, 'Skip this one')
          )
    )
  );
}

function Onboarding(props) {
  const onSave = props.onSave, onRecover = props.onRecover, saving = props.saving, colors = props.colors;
  const [mode, setMode] = useState('new');
  const [name, setName] = useState('');
  const [upi, setUpi] = useState('');
  const [pin, setPin] = useState('');
  const [recoverUpi, setRecoverUpi] = useState('');
  const [recoverPin, setRecoverPin] = useState('');
  const [recovering, setRecovering] = useState(false);
  const [recoverError, setRecoverError] = useState('');
  const pinValid = /^\d{4}$/.test(pin);
  const canSave = name.trim().length > 1 && upi.trim().length > 3 && pinValid;
  const recoverPinValid = /^\d{4}$/.test(recoverPin);
  const canRecover = recoverUpi.trim().length > 3 && recoverPinValid;

  async function handleRecover() {
    setRecovering(true);
    setRecoverError('');
    const errMsg = await onRecover(recoverUpi, recoverPin);
    setRecovering(false);
    if (errMsg) setRecoverError(errMsg);
  }

  if (mode === 'recover') {
    return h('div', { style: { backgroundColor: colors.paperLight, borderColor: colors.border }, className: 'rounded-lg border p-5' },
      h('p', { style: { fontFamily: "'Arvo', serif" }, className: 'font-bold mb-1' }, 'Recover your register'),
      h('p', { style: { color: colors.inkSoft }, className: 'text-sm mb-4' }, 'Enter the UPI ID and 4-digit PIN you set up with.'),
      h('label', { className: 'block text-xs font-medium mb-1' }, 'Your UPI ID'),
      h('input', { value: recoverUpi, onChange: e => setRecoverUpi(e.target.value), placeholder: 'e.g. priya@okhdfcbank', style: { borderColor: colors.border }, className: 'w-full border rounded-md px-3 py-2 text-sm mb-3 bg-white/60' }),
      h('label', { className: 'block text-xs font-medium mb-1' }, 'Your 4-digit PIN'),
      h('input', { value: recoverPin, onChange: e => setRecoverPin(e.target.value.replace(/\D/g,'').slice(0,4)), placeholder: '••••', inputMode: 'numeric', style: { borderColor: colors.border }, className: 'w-full border rounded-md px-3 py-2 text-sm mb-1 bg-white/60 tracking-widest' }),
      recoverError ? h('p', { style: { color: colors.redInk }, className: 'text-xs mb-3 mt-2' }, recoverError) : h('div', { className: 'mb-4' }),
      h('button', {
        disabled: !canRecover || recovering,
        onClick: handleRecover,
        style: { backgroundColor: colors.ink, color: colors.paperLight, opacity: (!canRecover || recovering) ? 0.5 : 1 },
        className: 'w-full rounded-md py-2.5 text-sm font-medium mb-3'
      }, recovering ? 'Looking up\u2026' : 'Recover my register'),
      h('button', { onClick: () => setMode('new'), style: { color: colors.inkSoft }, className: 'w-full text-xs hover:underline' }, 'Back to set up a new register')
    );
  }

  return h('div', { style: { backgroundColor: colors.paperLight, borderColor: colors.border }, className: 'rounded-lg border p-5' },
    h('p', { style: { fontFamily: "'Arvo', serif" }, className: 'font-bold mb-1' }, 'Set up your register'),
    h('p', { style: { color: colors.inkSoft }, className: 'text-sm mb-4' }, 'Used to generate your payment links and reminder messages.'),
    h('label', { className: 'block text-xs font-medium mb-1' }, 'Your name'),
    h('input', { value: name, onChange: e => setName(e.target.value), placeholder: 'e.g. Priya Sharma', style: { borderColor: colors.border }, className: 'w-full border rounded-md px-3 py-2 text-sm mb-3 bg-white/60' }),
    h('label', { className: 'block text-xs font-medium mb-1' }, 'Your UPI ID'),
    h('input', { value: upi, onChange: e => setUpi(e.target.value), placeholder: 'e.g. priya@okhdfcbank', style: { borderColor: colors.border }, className: 'w-full border rounded-md px-3 py-2 text-sm mb-3 bg-white/60' }),
    h('label', { className: 'block text-xs font-medium mb-1' }, 'Set a 4-digit recovery PIN'),
    h('input', { value: pin, onChange: e => setPin(e.target.value.replace(/\D/g,'').slice(0,4)), placeholder: '\u2022\u2022\u2022\u2022', inputMode: 'numeric', style: { borderColor: colors.border }, className: 'w-full border rounded-md px-3 py-2 text-sm mb-1 bg-white/60 tracking-widest' }),
    h('p', { style: { color: colors.inkSoft }, className: 'text-xs mb-4' }, 'Remember this \u2014 you\u2019ll need it along with your UPI ID to recover your account if you lose access.'),
    h('button', {
      disabled: !canSave || saving,
      onClick: () => onSave(name.trim(), upi.trim(), pin),
      style: { backgroundColor: colors.ink, color: colors.paperLight, opacity: (!canSave || saving) ? 0.5 : 1 },
      className: 'w-full rounded-md py-2.5 text-sm font-medium mb-3'
    }, saving ? 'Saving\u2026' : 'Start my register'),
    h('button', { onClick: () => setMode('recover'), style: { color: colors.inkSoft }, className: 'w-full text-xs hover:underline' }, 'Already have a register? Recover it')
  );
}

function AddMemberModal(props) {
  const onClose = props.onClose, onAdd = props.onAdd, colors = props.colors;
  const [name, setName] = useState('');
  const [phone, setPhone] = useState('');
  const [fee, setFee] = useState('');
  const [joinedMonth, setJoinedMonth] = useState(monthKey(new Date()));
  const [photo, setPhoto] = useState(null);
  const [studentClass, setStudentClass] = useState('');
  const [parentName, setParentName] = useState('');
  const [submitting, setSubmitting] = useState(false);
  const [localError, setLocalError] = useState('');
  const photoInputRef = useRef(null);
  const phoneValid = /^\d{10}$/.test(phone);
  const canAdd = name.trim().length > 1 && phoneValid && Number(fee) > 0;

  async function handlePhotoChange(file) {
    if (!file) return;
    try { const compressed = await compressPhoto(file); setPhoto(compressed); } catch (e) {}
  }

  async function handleSubmit() {
    setSubmitting(true);
    setLocalError('');
    const errMsg = await onAdd(name.trim(), phone, fee, joinedMonth, photo, studentClass.trim(), parentName.trim());
    setSubmitting(false);
    if (errMsg) setLocalError(errMsg);
  }

  return h('div', { className: 'fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center z-50 p-4' },
    h('div', { style: { backgroundColor: colors.paperLight }, className: 'w-full max-w-md rounded-xl p-5' },
      h('div', { className: 'flex items-center justify-between mb-4' },
        h('p', { style: { fontFamily: "'Arvo', serif" }, className: 'font-bold' }, 'New entry'),
        h('button', { onClick: onClose }, '\u2715')
      ),
      h('div', { className: 'flex justify-center mb-4' },
        h('input', { ref: photoInputRef, type: 'file', accept: 'image/*', className: 'hidden', onChange: e => handlePhotoChange(e.target.files[0]) }),
        h('button', {
          onClick: () => photoInputRef.current.click(),
          style: { borderColor: colors.border, backgroundColor: colors.paper },
          className: 'w-16 h-16 rounded-full border flex items-center justify-center overflow-hidden'
        }, photo ? h('img', { src: photo, className: 'w-full h-full object-cover' }) : h('span', { style: { color: colors.inkSoft }, className: 'text-xs' }, 'Photo'))
      ),
      h('label', { className: 'block text-xs font-medium mb-1' }, 'Student name'),
      h('input', { value: name, onChange: e => setName(e.target.value), placeholder: 'e.g. Aarav Mehta', style: { borderColor: colors.border }, className: 'w-full border rounded-md px-3 py-2 text-sm mb-3 bg-white/60' }),
      h('label', { className: 'block text-xs font-medium mb-1' }, "Parent's WhatsApp number"),
      h('div', { className: 'flex items-center gap-2 mb-1' },
        h('span', { style: { color: colors.inkSoft }, className: 'text-sm' }, '+91'),
        h('input', { value: phone, onChange: e => setPhone(e.target.value.replace(/\D/g,'').slice(0,10)), placeholder: '10-digit number', style: { borderColor: colors.border }, className: 'flex-1 border rounded-md px-3 py-2 text-sm bg-white/60' })
      ),
      (phone.length > 0 && !phoneValid) ? h('p', { style: { color: colors.redInk }, className: 'text-xs mb-2' }, 'Enter a valid 10-digit number.') : null,
      h('label', { className: 'block text-xs font-medium mb-1 mt-2' }, 'Class / grade (optional)'),
      h('input', { value: studentClass, onChange: e => setStudentClass(e.target.value), placeholder: 'e.g. Class 8', style: { borderColor: colors.border }, className: 'w-full border rounded-md px-3 py-2 text-sm mb-3 bg-white/60' }),
      h('label', { className: 'block text-xs font-medium mb-1' }, "Parent's name (optional)"),
      h('input', { value: parentName, onChange: e => setParentName(e.target.value), placeholder: 'e.g. Mrs. Mehta', style: { borderColor: colors.border }, className: 'w-full border rounded-md px-3 py-2 text-sm mb-3 bg-white/60' }),
      h('label', { className: 'block text-xs font-medium mb-1' }, 'Monthly fee (\u20B9)'),
      h('input', { value: fee, onChange: e => setFee(e.target.value.replace(/[^\d]/g,'')), placeholder: 'e.g. 1500', style: { borderColor: colors.border }, className: 'w-full border rounded-md px-3 py-2 text-sm mb-3 bg-white/60' }),
      h('label', { className: 'block text-xs font-medium mb-1' }, 'Student since'),
      h('input', { type: 'month', value: joinedMonth, onChange: e => setJoinedMonth(e.target.value), style: { borderColor: colors.border }, className: 'w-full border rounded-md px-3 py-2 text-sm mb-1 bg-white/60' }),
      h('p', { style: { color: colors.inkSoft }, className: 'text-xs mb-4' }, 'Set this to when they actually started \u2014 past months will show as due until you mark them paid.'),
      localError ? h('p', { style: { color: colors.redInk }, className: 'text-xs mb-3' }, localError) : null,
      h('button', {
        disabled: !canAdd || submitting,
        onClick: handleSubmit,
        style: { backgroundColor: colors.ink, color: colors.paperLight, opacity: (canAdd && !submitting) ? 1 : 0.5 },
        className: 'w-full rounded-md py-2.5 text-sm font-medium'
      }, submitting ? 'Adding\u2026' : 'Add to register')
    )
  );
}

function MarkPaidModal(props) {
  const onClose = props.onClose, onConfirm = props.onConfirm, saving = props.saving, colors = props.colors;
  const outstanding = props.outstandingMonths || [];
  const [selected, setSelected] = useState(outstanding.slice());
  const [file, setFile] = useState(null);
  const [preview, setPreview] = useState(null);
  const inputRef = useRef(null);

  function toggleMonth(mk) {
    if (selected.indexOf(mk) >= 0) setSelected(selected.filter(x => x !== mk));
    else setSelected(selected.concat([mk]));
  }
  function handleFile(f) { setFile(f); if (f) setPreview(URL.createObjectURL(f)); }

  return h('div', { className: 'fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center z-50 p-4' },
    h('div', { style: { backgroundColor: colors.paperLight }, className: 'w-full max-w-md rounded-xl p-5' },
      h('div', { className: 'flex items-center justify-between mb-4' },
        h('p', { style: { fontFamily: "'Arvo', serif" }, className: 'font-bold' }, 'Mark as paid'),
        h('button', { onClick: onClose }, '\u2715')
      ),
      h('p', { style: { color: colors.inkSoft }, className: 'text-sm mb-2' }, 'Select which month(s) this payment covers:'),
      h('div', { className: 'space-y-1.5 mb-4' },
        outstanding.map(function(mk) {
          const checked = selected.indexOf(mk) >= 0;
          return h('label', { key: mk, className: 'flex items-center gap-2 text-sm cursor-pointer' },
            h('input', { type: 'checkbox', checked: checked, onChange: () => toggleMonth(mk) }),
            h('span', null, monthLabel(mk))
          );
        })
      ),
      h('p', { style: { color: colors.inkSoft }, className: 'text-sm mb-3' }, 'Attach the payment screenshot the parent sent you, for your records.'),
      h('input', { ref: inputRef, type: 'file', accept: 'image/*', className: 'hidden', onChange: e => handleFile(e.target.files[0]) }),
      preview
        ? h('button', { onClick: () => inputRef.current.click(), className: 'w-full mb-4' },
            h('img', { src: preview, className: 'w-full max-h-48 object-contain rounded-md border', style: { borderColor: colors.border } })
          )
        : h('button', {
            onClick: () => inputRef.current.click(),
            style: { borderColor: colors.border, color: colors.inkSoft },
            className: 'w-full border border-dashed rounded-md py-8 text-xs mb-4'
          }, 'Tap to attach screenshot (optional)'),
      h('button', {
        disabled: saving || selected.length === 0,
        onClick: () => onConfirm(selected, file),
        style: { backgroundColor: colors.greenInk, color: colors.paperLight, opacity: (saving || selected.length === 0) ? 0.6 : 1 },
        className: 'w-full rounded-md py-2.5 text-sm font-medium'
      }, saving ? 'Saving\u2026' : ('Confirm paid (' + selected.length + ' month' + (selected.length !== 1 ? 's' : '') + ')'))
    )
  );
}
