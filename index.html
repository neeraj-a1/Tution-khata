function monthsBetweenInclusive(startKey, endKey) {
  const s = startKey.split('-').map(Number);
  const e = endKey.split('-').map(Number);
  const out = [];
  let y = s[0], m = s[1];
  while (y < e[0] || (y === e[0] && m <= e[1])) {

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 700;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.55));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
// NEW: a separate, higher-quality compressor just for an uploaded UPI QR
// code image. compressImage() above (used for payment-proof screenshots)
// squeezes hard — 700px wide, 55% JPEG quality — which is fine for
// something a human just needs to glance at, but a QR code is made of
// small black/white squares that a phone camera has to read back
// correctly. Too much compression can blur those squares enough that
// scanning fails. This keeps more size and quality specifically so the
// code stays reliably scannable, at the cost of a somewhat larger file.
function compressQrCodeImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {

      img.onload = () => {
        const maxW = 900;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.9));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function compressPhoto(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const size = 200;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const scale = Math.max(size / img.width, size / img.height);
        const w = img.width * scale, hgt = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - hgt) / 2, w, hgt);
        resolve(canvas.toDataURL('image/jpeg', 0.6));

      img.src = e.target.result;
    };

  });
}

        }, photo ? h('img', { src: photo, className: 'w-full h-full object-cover' }) : h('span', { style: { color: colors.inkSoft }, className: 'text-xs' }, 'Photo'))
      ),

}
function EditMemberModal(props) {
  const member = props.member, onClose = props.onClose, onSave = props.onSave, colors = props.colors;
  const [name, setName] = useState(member.name);
  const [phone, setPhone] = useState(member.phone);
  const [fee, setFee] = useState(String(member.fee));
  const [photo, setPhoto] = useState(member.photo || null);
  const [studentClass, setStudentClass] = useState(member.student_class || '');
  const [parentName, setParentName] = useState(member.parent_name || '');
  const [submitting, setSubmitting] = useState(false);
  const [localError, setLocalError] = useState('');
  const photoInputRef = useRef(null);
  const phoneValid = /^\d{10}$/.test(phone);
  const canSave = name.trim().length > 1 && phoneValid && Number(fee) > 0;
  async function handlePhotoChange(file) {
    if (!file) return;
    try { const compressed = await compressPhoto(file); setPhoto(compressed); } catch (e) {}
  }
  async function handleSubmit() {
    setSubmitting(true);
    setLocalError('');
    const errMsg = await onSave(member.id, name.trim(), phone, fee, photo, studentClass.trim(), parentName.trim());
    setSubmitting(false);
    if (errMsg) setLocalError(errMsg);
  }
  return h('div', { className: 'fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center z-50 p-4' },
    // Full-width on mobile, narrower on laptop-size screens and up (lg: =
    // 1024px+), and — CHANGED — now capped to 85% of the window height
    // with its own scrollbar on every screen size, not just lg+. Before
    // this fix, a phone in portrait mode with a tall form (Edit Profile,
    // once it had several optional fields) had no scrollbar at all: the
    // sheet is bottom-anchored on mobile, so anything taller than the
    // screen just got pushed off the TOP, invisible and unreachable —
    // Neeraj flagged this from a real phone screenshot. Capping the
    // height and scrolling internally on every screen size fixes that.
    h('div', { style: { backgroundColor: colors.paperLight }, className: 'w-full max-w-md lg:max-w-sm max-h-[85vh] overflow-y-auto rounded-xl p-5' },
      h('div', { className: 'flex items-center justify-between mb-4' },
        h('p', { style: { fontFamily: "'Arvo', serif" }, className: 'font-bold' }, 'Edit student'),
        h('button', { onClick: onClose }, '✕')
      ),
      h('div', { className: 'flex justify-center mb-4' },
        h('input', { ref: photoInputRef, type: 'file', accept: 'image/*', className: 'hidden', onChange: e => handlePhotoChange(e.target.files[0]) }),
        h('button', {
          onClick: () => photoInputRef.current.click(),
          style: { borderColor: colors.border, backgroundColor: colors.paper },
          className: 'w-16 h-16 rounded-full border flex items-center justify-center overflow-hidden'
        }, photo ? h('img', { src: photo, className: 'w-full h-full object-cover' }) : h('span', { style: { color: colors.inkSoft }, className: 'text-xs' }, 'Photo'))
      ),
      h('label', { className: 'block text-xs font-medium mb-1' }, 'Student name'),
      h('input', { value: name, onChange: e => setName(e.target.value), style: { borderColor: colors.border }, className: 'w-full border rounded-md px-3 py-2 text-sm mb-3 bg-white/60' }),
      h('label', { className: 'block text-xs font-medium mb-1' }, "Parent's WhatsApp number"),
      h('div', { className: 'flex items-center gap-2 mb-1' },
        h('span', { style: { color: colors.inkSoft }, className: 'text-sm' }, '+91'),
        h('input', { value: phone, onChange: e => setPhone(e.target.value.replace(/\D/g,'').slice(0,10)), style: { borderColor: colors.border }, className: 'flex-1 border rounded-md px-3 py-2 text-sm bg-white/60' })
      ),
      (phone.length > 0 && !phoneValid) ? h('p', { style: { color: colors.redInk }, className: 'text-xs mb-2' }, 'Enter a valid 10-digit number.') : null,
      h('label', { className: 'block text-xs font-medium mb-1 mt-2' }, 'Class / grade (optional)'),
      h('input', { value: studentClass, onChange: e => setStudentClass(e.target.value), placeholder: 'e.g. Class 8', style: { borderColor: colors.border }, className: 'w-full border rounded-md px-3 py-2 text-sm mb-3 bg-white/60' }),
      h('label', { className: 'block text-xs font-medium mb-1' }, "Parent's name (optional)"),
      h('input', { value: parentName, onChange: e => setParentName(e.target.value), placeholder: 'e.g. Mrs. Mehta', style: { borderColor: colors.border }, className: 'w-full border rounded-md px-3 py-2 text-sm mb-3 bg-white/60' }),
      h('label', { className: 'block text-xs font-medium mb-1' }, 'Monthly fee (₹) — required'),
      h('input', { value: fee, onChange: e => setFee(e.target.value.replace(/[^\d]/g,'')), style: { borderColor: colors.border }, className: 'w-full border rounded-md px-3 py-2 text-sm mb-1 bg-white/60' }),
      h('p', { style: { color: colors.inkSoft }, className: 'text-xs mb-4' }, 'This updates their fee going forward — months already marked paid are not affected.'),
      localError ? h('p', { style: { color: colors.redInk }, className: 'text-xs mb-3' }, localError) : null,
      h('button', {
        disabled: !canSave || submitting,
        onClick: handleSubmit,
        style: { backgroundColor: colors.ink, color: colors.paperLight, opacity: (canSave && !submitting) ? 1 : 0.5 },
        className: 'w-full rounded-md py-2.5 text-sm font-medium'
      }, submitting ? 'Saving…' : 'Save changes')
    )
  );
}
function MarkPaidModal(props) {
  const onClose = props.onClose, onConfirm = props.onConfirm, saving = props.saving, colors = props.colors;
  const outstanding = props.outstandingMonths || [];
  const [selected, setSelected] = useState(outstanding.slice());
  const [file, setFile] = useState(null);
  const [preview, setPreview] = useState(null);
  const inputRef = useRef(null);
  function toggleMonth(mk) {
    if (selected.indexOf(mk) >= 0) setSelected(selected.filter(x => x !== mk));
    else setSelected(selected.concat([mk]));
  }
  function handleFile(f) { setFile(f); if (f) setPreview(URL.createObjectURL(f)); }
  return h('div', { className: 'fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center z-50 p-4' },
    // Full-width on mobile, narrower on laptop-size screens and up (lg: =
    // 1024px+), and — CHANGED — now capped to 85% of the window height
    // with its own scrollbar on every screen size, not just lg+. Before
    // this fix, a phone in portrait mode with a tall form (Edit Profile,
    // once it had several optional fields) had no scrollbar at all: the
    // sheet is bottom-anchored on mobile, so anything taller than the
    // screen just got pushed off the TOP, invisible and unreachable —
    // Neeraj flagged this from a real phone screenshot. Capping the
    // height and scrolling internally on every screen size fixes that.
    h('div', { style: { backgroundColor: colors.paperLight }, className: 'w-full max-w-md lg:max-w-sm max-h-[85vh] overflow-y-auto rounded-xl p-5' },
      h('div', { className: 'flex items-center justify-between mb-4' },
        h('p', { style: { fontFamily: "'Arvo', serif" }, className: 'font-bold' }, 'Mark as paid'),
        h('button', { onClick: onClose }, '✕')
      ),
      h('p', { style: { color: colors.inkSoft }, className: 'text-sm mb-2' }, 'Select which month(s) this payment covers:'),
      h('div', { className: 'space-y-1.5 mb-4' },
        outstanding.map(function(mk) {
          const checked = selected.indexOf(mk) >= 0;
          return h('label', { key: mk, className: 'flex items-center gap-2 text-sm cursor-pointer' },
            h('input', { type: 'checkbox', checked: checked, onChange: () => toggleMonth(mk) }),
            h('span', null, monthLabel(mk))
          );
        })
      ),
      h('p', { style: { color: colors.inkSoft }, className: 'text-sm mb-3' }, 'Attach the payment screenshot the parent sent you, for your records.'),
      h('input', { ref: inputRef, type: 'file', accept: 'image/*', className: 'hidden', onChange: e => handleFile(e.target.files[0]) }),
      preview
        ? h('button', { onClick: () => inputRef.current.click(), className: 'w-full mb-4' },
            h('img', { src: preview, className: 'w-full max-h-48 object-contain rounded-md border', style: { borderColor: colors.border } })
          )
        : h('button', {
            onClick: () => inputRef.current.click(),
            style: { borderColor: colors.border, color: colors.inkSoft },
            className: 'w-full border border-dashed rounded-md py-8 text-xs mb-4'
          }, 'Tap to attach screenshot (optional)'),
      h('button', {
        disabled: saving || selected.length === 0,
        onClick: () => onConfirm(selected, file),
        style: { backgroundColor: colors.greenInk, color: colors.paperLight, opacity: (saving || selected.length === 0) ? 0.6 : 1 },
        className: 'w-full rounded-md py-2.5 text-sm font-medium'
      }, saving ? 'Saving…' : ('Confirm paid (' + selected.length + ' month' + (selected.length !== 1 ? 's' : '') + ')'))
    )
  );
}
