<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tuition Khata</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  body { margin: 0; }
</style>

<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          serif: ['Arvo', 'serif'],
          sans: ['IBM Plex Sans', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        }
      }
    }
  }
</script>
</head>
<body>
<div id="root"></div>

<script>
const { useState, useEffect, useRef } = React;
const h = React.createElement;

// ====================================================================
const SUPABASE_URL = 'https://xgsbjyqdkeaeihzhadgs.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_vP7cJ9AA9Ubf5dVu_WxEkg_fuymQNU5';
// ====================================================================

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const COLORS = {
  paper: '#E7E6D9', paperLight: '#F4F3EA', ink: '#1E2A3A',
  inkSoft: '#5C6357', redInk: '#A6321F', greenInk: '#2F6B3A', border: '#C9C7B4',
};

function monthKey(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(k) { const parts = k.split('-').map(Number); return MONTHS[parts[1]-1] + ' ' + parts[0]; }
function formatDate(iso) { return new Date(iso).toLocaleDateString('en-IN',{day:'numeric',month:'short'}); }

function monthsBetweenInclusive(startKey, endKey) {
  const s = startKey.split('-').map(Number);
  const e = endKey.split('-').map(Number);
  const out = [];
  let y = s[0], m = s[1];
  while (y < e[0] || (y === e[0] && m <= e[1])) {
    out.push(y + '-' + String(m).padStart(2, '0'));
    m++;
    if (m > 12) { m = 1; y++; }
  }
  return out;
}

function studentMonths(member) {
  const startKey = member.joined_month || monthKey(new Date(member.created_at));
  const endKey = monthKey(new Date());
  return monthsBetweenInclusive(startKey, endKey);
}

function outstandingMonths(member, payments) {
  return studentMonths(member).filter(function(mk) {
    const p = payments[member.id + '_' + mk];
    return !(p && p.paid);
  });
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 700;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.55));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function Stamp(props) {
  const paid = props.paid;
  const label = props.label || (paid ? 'Paid' : 'Pending');
  return h('div', {
    style: {
      color: paid ? COLORS.greenInk : COLORS.redInk,
      border: '2.5px double ' + (paid ? COLORS.greenInk : COLORS.redInk),
      transform: paid ? 'rotate(-6deg)' : 'rotate(4deg)',
      fontFamily: "'Arvo', serif",
      whiteSpace: 'nowrap',
    },
    className: 'px-2 py-0.5 text-[11px] font-bold tracking-widest uppercase rounded-sm select-none'
  }, label);
}

function App() {
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [tutorId, setTutorId] = useState(null);
  const [profile, setProfile] = useState(null);
  const [members, setMembers] = useState([]);
  const [payments, setPayments] = useState({});
  const [showAdd, setShowAdd] = useState(false);
  const [markPaidFor, setMarkPaidFor] = useState(null);
  const [expandedHistory, setExpandedHistory] = useState(null);
  const [lightbox, setLightbox] = useState(null);
  const [error, setError] = useState('');

  useEffect(() => {
    const savedId = localStorage.getItem('tutor_id');
    if (savedId) { setTutorId(savedId); loadData(savedId); }
    else { setLoading(false); }
  }, []);

  async function loadData(id) {
    setLoading(true);
    const t = await sb.from('tutors').select('*').eq('id', id).single();
    if (t.data) setProfile(t.data);
    const m = await sb.from('members').select('*').eq('tutor_id', id);
    const mem = m.data || [];
    setMembers(mem);
    if (mem.length) {
      const ids = mem.map(x => x.id);
      const p = await sb.from('payments').select('*').in('member_id', ids);
      const map = {};
      (p.data || []).forEach(pay => { map[pay.member_id + '_' + pay.month] = pay; });
      setPayments(map);
    }
    setLoading(false);
  }

  async function createTutor(name, upi) {
    setSaving(true);
    const res = await sb.from('tutors').insert({ name: name, upi_id: upi }).select().single();
    if (res.error) { setError('Could not create your register. Please try again.'); setSaving(false); return; }
    localStorage.setItem('tutor_id', res.data.id);
    setTutorId(res.data.id);
    setProfile(res.data);
    setSaving(false);
  }

  async function addMember(name, phone, fee, joinedMonth) {
    const res = await sb.from('members')
      .insert({ tutor_id: tutorId, name: name, phone: phone, fee: Number(fee), joined_month: joinedMonth }).select().single();
    if (res.error) { setError('Could not add student. Please try again.'); return; }
    setMembers(members.concat([res.data]));
    setShowAdd(false);
  }

  function buildUpiLink(member, amount) {
    const params = new URLSearchParams({
      pa: profile.upi_id, pn: profile.name, am: String(amount), cu: 'INR', tn: 'Tuition fee'
    });
    return 'upi://pay?' + params.toString();
  }

  function sendReminder(member) {
    const outstanding = outstandingMonths(member, payments);
    if (outstanding.length === 0) return;
    const total = outstanding.length * Number(member.fee);
    const monthsList = outstanding.map(monthLabel).join(', ');
    const upiLink = buildUpiLink(member, total);
    const breakdown = outstanding.length > 1
      ? ' (' + outstanding.length + ' months \u00d7 Rs.' + member.fee + ')'
      : '';
    const msg = "Hi! This is a reminder for " + member.name + "'s tuition fee.\n\nPending: " + monthsList +
      "\nTotal due: Rs." + total + breakdown +
      "\n\nPay here: " + upiLink + "\n\nKindly share a screenshot after payment for our records. Thank you!\n\n\u2014 sent via Tuition Khata";
    const digits = member.phone.replace(/\D/g, '');
    const waPhone = digits.length === 10 ? '91' + digits : digits;
    window.open('https://wa.me/' + waPhone + '?text=' + encodeURIComponent(msg), '_blank');
  }

  async function handleMarkPaid(memberId, monthsToMark, file) {
    setSaving(true);
    let screenshot = null;
    try { if (file) screenshot = await compressImage(file); } catch (e) {}
    const now = new Date().toISOString();
    const next = Object.assign({}, payments);
    for (let i = 0; i < monthsToMark.length; i++) {
      const mk = monthsToMark[i];
      const res = await sb.from('payments')
        .upsert({ member_id: memberId, month: mk, paid: true, screenshot: screenshot, paid_at: now },
          { onConflict: 'member_id,month' }).select().single();
      if (!res.error) next[memberId + '_' + mk] = res.data;
    }
    setPayments(next);
    setSaving(false);
    setMarkPaidFor(null);
  }

  async function unmarkPaid(memberId, mk) {
    await sb.from('payments').delete().eq('member_id', memberId).eq('month', mk);
    const next = Object.assign({}, payments);
    delete next[memberId + '_' + mk];
    setPayments(next);
  }

  if (loading) {
    return h('div', { style: { backgroundColor: COLORS.paper }, className: 'min-h-screen flex items-center justify-center font-sans' },
      h('span', { style: { color: COLORS.inkSoft } }, 'Loading\u2026')
    );
  }

  const errorBox = error ? h('div', { style: { color: COLORS.redInk }, className: 'text-sm mb-4' }, error) : null;

  const emptyState = h('div', { style: { borderColor: COLORS.border, color: COLORS.inkSoft }, className: 'border border-dashed rounded-lg py-10 px-4 text-center mb-5' },
    h('p', { className: 'text-sm' }, 'No entries yet.', h('br'), 'Add your first student to begin your register.')
  );

  const memberCards = h('div', { className: 'space-y-3 mb-5' },
    members.map((m) => {
      const outstanding = outstandingMonths(m, payments);
      const allMonths = studentMonths(m).slice().reverse();
      const totalDue = outstanding.length * Number(m.fee);
      const isExpanded = expandedHistory === m.id;
      const statusLabel = outstanding.length === 0 ? 'All paid' : (outstanding.length + ' month' + (outstanding.length > 1 ? 's' : '') + ' due');

      const historyPanel = isExpanded ? h('div', { className: 'mt-3 pt-3 border-t space-y-1.5', style: { borderColor: COLORS.border } },
        allMonths.map(function(mk) {
          const p = payments[m.id + '_' + mk];
          const isPaid = !!(p && p.paid);
          return h('div', { key: mk, className: 'flex items-center justify-between text-xs' },
            h('span', { style: { color: COLORS.inkSoft } }, monthLabel(mk)),
            isPaid
              ? h('div', { className: 'flex items-center gap-2' },
                  p.screenshot ? h('button', { onClick: () => setLightbox(p.screenshot) },
                    h('img', { src: p.screenshot, className: 'w-6 h-6 object-cover rounded border', style: { borderColor: COLORS.border } })
                  ) : null,
                  h('span', { style: { color: COLORS.greenInk } }, 'Paid ' + formatDate(p.paid_at)),
                  h('button', { onClick: () => unmarkPaid(m.id, mk), style: { color: COLORS.inkSoft }, className: 'hover:underline' }, 'Undo')
                )
              : h('span', { style: { color: COLORS.redInk } }, 'Pending')
          );
        })
      ) : null;

      return h('div', { key: m.id, style: { backgroundColor: COLORS.paperLight, borderColor: COLORS.border }, className: 'rounded-lg border p-4' },
        h('div', { className: 'flex items-start justify-between mb-1' },
          h('div', null,
            h('p', { className: 'font-semibold text-[15px]' }, m.name),
            h('p', { style: { fontFamily: "'IBM Plex Mono', monospace", color: COLORS.inkSoft }, className: 'text-xs mt-0.5' }, '+91 ' + m.phone)
          ),
          h(Stamp, { paid: outstanding.length === 0, label: statusLabel })
        ),
        h('p', { style: { fontFamily: "'IBM Plex Mono', monospace" }, className: 'text-lg font-medium mt-2' },
          '\u20B9' + Number(m.fee).toLocaleString('en-IN'),
          h('span', { style: { color: COLORS.inkSoft }, className: 'text-xs font-normal font-sans' }, ' / month')
        ),
        outstanding.length > 0 ? h('p', { style: { color: COLORS.redInk }, className: 'text-xs font-medium mb-3' },
          'Total due: \u20B9' + totalDue.toLocaleString('en-IN') + (outstanding.length > 1 ? ' (' + outstanding.length + ' months)' : '')
        ) : h('div', { className: 'mb-3' }),
        outstanding.length > 0
          ? h('div', { className: 'flex gap-2' },
              h('button', { onClick: () => sendReminder(m), style: { backgroundColor: COLORS.ink, color: COLORS.paperLight }, className: 'flex-1 rounded-md py-2 text-xs font-medium' }, 'Remind on WhatsApp'),
              h('button', { onClick: () => setMarkPaidFor(m.id), style: { borderColor: COLORS.ink, color: COLORS.ink }, className: 'flex-1 rounded-md py-2 text-xs font-medium border' }, 'Mark Paid')
            )
          : null,
        h('button', {
          onClick: () => setExpandedHistory(isExpanded ? null : m.id),
          style: { color: COLORS.inkSoft },
          className: 'text-xs mt-3 hover:underline'
        }, isExpanded ? 'Hide history' : 'View history'),
        historyPanel
      );
    })
  );

  const mainContent = !profile
    ? h(Onboarding, { onSave: createTutor, saving: saving, colors: COLORS })
    : h(React.Fragment, null,
        errorBox,
        members.length === 0 ? emptyState : memberCards,
        h('button', { onClick: () => setShowAdd(true), style: { borderColor: COLORS.ink, color: COLORS.ink }, className: 'w-full border border-dashed rounded-lg py-3 text-sm font-medium' }, '+ Add Student')
      );

  const markPaidMember = markPaidFor ? members.find(x => x.id === markPaidFor) : null;
  const markPaidOutstanding = markPaidMember ? outstandingMonths(markPaidMember, payments) : [];

  return h('div', { style: { backgroundColor: COLORS.paper, color: COLORS.ink }, className: 'min-h-screen font-sans' },
    h('div', { className: 'max-w-md mx-auto px-4 pb-24 pt-6' },
      h('div', { className: 'flex items-center gap-2 mb-1' },
        h('span', { className: 'text-2xl' }, '\uD83D\uDCD6'),
        h('h1', { style: { fontFamily: "'Arvo', serif" }, className: 'text-2xl font-bold tracking-tight' }, 'Tuition Khata')
      ),
      h('p', { style: { color: COLORS.inkSoft }, className: 'text-sm mb-6 ml-8' }, 'your fee register'),
      mainContent
    ),
    showAdd ? h(AddMemberModal, { onClose: () => setShowAdd(false), onAdd: addMember, colors: COLORS }) : null,
    markPaidFor ? h(MarkPaidModal, {
      onClose: () => setMarkPaidFor(null),
      saving: saving,
      outstandingMonths: markPaidOutstanding,
      onConfirm: (monthsToMark, file) => handleMarkPaid(markPaidFor, monthsToMark, file),
      colors: COLORS
    }) : null,
    lightbox ? h('div', { className: 'fixed inset-0 bg-black/80 flex items-center justify-center p-6 z-50', onClick: () => setLightbox(null) },
      h('img', { src: lightbox, className: 'max-w-full max-h-full rounded-lg' })
    ) : null
  );
}

function Onboarding(props) {
  const onSave = props.onSave, saving = props.saving, colors = props.colors;
  const [name, setName] = useState('');
  const [upi, setUpi] = useState('');
  const canSave = name.trim().length > 1 && upi.trim().length > 3;
  return h('div', { style: { backgroundColor: colors.paperLight, borderColor: colors.border }, className: 'rounded-lg border p-5' },
    h('p', { style: { fontFamily: "'Arvo', serif" }, className: 'font-bold mb-1' }, 'Set up your register'),
    h('p', { style: { color: colors.inkSoft }, className: 'text-sm mb-4' }, 'Used to generate your payment links and reminder messages.'),
    h('label', { className: 'block text-xs font-medium mb-1' }, 'Your name'),
    h('input', { value: name, onChange: e => setName(e.target.value), placeholder: 'e.g. Priya Sharma', style: { borderColor: colors.border }, className: 'w-full border rounded-md px-3 py-2 text-sm mb-3 bg-white/60' }),
    h('label', { className: 'block text-xs font-medium mb-1' }, 'Your UPI ID'),
    h('input', { value: upi, onChange: e => setUpi(e.target.value), placeholder: 'e.g. priya@okhdfcbank', style: { borderColor: colors.border }, className: 'w-full border rounded-md px-3 py-2 text-sm mb-4 bg-white/60' }),
    h('button', {
      disabled: !canSave || saving,
      onClick: () => onSave(name.trim(), upi.trim()),
      style: { backgroundColor: colors.ink, color: colors.paperLight, opacity: (!canSave || saving) ? 0.5 : 1 },
      className: 'w-full rounded-md py-2.5 text-sm font-medium'
    }, saving ? 'Saving\u2026' : 'Start my register')
  );
}

function AddMemberModal(props) {
  const onClose = props.onClose, onAdd = props.onAdd, colors = props.colors;
  const [name, setName] = useState('');
  const [phone, setPhone] = useState('');
  const [fee, setFee] = useState('');
  const [joinedMonth, setJoinedMonth] = useState(monthKey(new Date()));
  const phoneValid = /^\d{10}$/.test(phone);
  const canAdd = name.trim().length > 1 && phoneValid && Number(fee) > 0;
  return h('div', { className: 'fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center z-50 p-4' },
    h('div', { style: { backgroundColor: colors.paperLight }, className: 'w-full max-w-md rounded-xl p-5' },
      h('div', { className: 'flex items-center justify-between mb-4' },
        h('p', { style: { fontFamily: "'Arvo', serif" }, className: 'font-bold' }, 'New entry'),
        h('button', { onClick: onClose }, '\u2715')
      ),
      h('label', { className: 'block text-xs font-medium mb-1' }, 'Student name'),
      h('input', { value: name, onChange: e => setName(e.target.value), placeholder: 'e.g. Aarav Mehta', style: { borderColor: colors.border }, className: 'w-full border rounded-md px-3 py-2 text-sm mb-3 bg-white/60' }),
      h('label', { className: 'block text-xs font-medium mb-1' }, "Parent's WhatsApp number"),
      h('div', { className: 'flex items-center gap-2 mb-1' },
        h('span', { style: { color: colors.inkSoft }, className: 'text-sm' }, '+91'),
        h('input', { value: phone, onChange: e => setPhone(e.target.value.replace(/\D/g,'').slice(0,10)), placeholder: '10-digit number', style: { borderColor: colors.border }, className: 'flex-1 border rounded-md px-3 py-2 text-sm bg-white/60' })
      ),
      (phone.length > 0 && !phoneValid) ? h('p', { style: { color: colors.redInk }, className: 'text-xs mb-2' }, 'Enter a valid 10-digit number.') : null,
      h('label', { className: 'block text-xs font-medium mb-1 mt-2' }, 'Monthly fee (\u20B9)'),
      h('input', { value: fee, onChange: e => setFee(e.target.value.replace(/[^\d]/g,'')), placeholder: 'e.g. 1500', style: { borderColor: colors.border }, className: 'w-full border rounded-md px-3 py-2 text-sm mb-3 bg-white/60' }),
      h('label', { className: 'block text-xs font-medium mb-1' }, 'Student since'),
      h('input', { type: 'month', value: joinedMonth, onChange: e => setJoinedMonth(e.target.value), style: { borderColor: colors.border }, className: 'w-full border rounded-md px-3 py-2 text-sm mb-1 bg-white/60' }),
      h('p', { style: { color: colors.inkSoft }, className: 'text-xs mb-4' }, 'Set this to when they actually started \u2014 past months will show as due until you mark them paid.'),
      h('button', {
        disabled: !canAdd,
        onClick: () => onAdd(name.trim(), phone, fee, joinedMonth),
        style: { backgroundColor: colors.ink, color: colors.paperLight, opacity: canAdd ? 1 : 0.5 },
        className: 'w-full rounded-md py-2.5 text-sm font-medium'
      }, 'Add to register')
    )
  );
}

function MarkPaidModal(props) {
  const onClose = props.onClose, onConfirm = props.onConfirm, saving = props.saving, colors = props.colors;
  const outstanding = props.outstandingMonths || [];
  const [selected, setSelected] = useState(outstanding.slice());
  const [file, setFile] = useState(null);
  const [preview, setPreview] = useState(null);
  const inputRef = useRef(null);

  function toggleMonth(mk) {
    if (selected.indexOf(mk) >= 0) setSelected(selected.filter(x => x !== mk));
    else setSelected(selected.concat([mk]));
  }
  function handleFile(f) { setFile(f); if (f) setPreview(URL.createObjectURL(f)); }

  return h('div', { className: 'fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center z-50 p-4' },
    h('div', { style: { backgroundColor: colors.paperLight }, className: 'w-full max-w-md rounded-xl p-5' },
      h('div', { className: 'flex items-center justify-between mb-4' },
        h('p', { style: { fontFamily: "'Arvo', serif" }, className: 'font-bold' }, 'Mark as paid'),
        h('button', { onClick: onClose }, '\u2715')
      ),
      h('p', { style: { color: colors.inkSoft }, className: 'text-sm mb-2' }, 'Select which month(s) this payment covers:'),
      h('div', { className: 'space-y-1.5 mb-4' },
        outstanding.map(function(mk) {
          const checked = selected.indexOf(mk) >= 0;
          return h('label', { key: mk, className: 'flex items-center gap-2 text-sm cursor-pointer' },
            h('input', { type: 'checkbox', checked: checked, onChange: () => toggleMonth(mk) }),
            h('span', null, monthLabel(mk))
          );
        })
      ),
      h('p', { style: { color: colors.inkSoft }, className: 'text-sm mb-3' }, 'Attach the payment screenshot the parent sent you, for your records.'),
      h('input', { ref: inputRef, type: 'file', accept: 'image/*', className: 'hidden', onChange: e => handleFile(e.target.files[0]) }),
      preview
        ? h('button', { onClick: () => inputRef.current.click(), className: 'w-full mb-4' },
            h('img', { src: preview, className: 'w-full max-h-48 object-contain rounded-md border', style: { borderColor: colors.border } })
          )
        : h('button', {
            onClick: () => inputRef.current.click(),
            style: { borderColor: colors.border, color: colors.inkSoft },
            className: 'w-full border border-dashed rounded-md py-8 text-xs mb-4'
          }, 'Tap to attach screenshot (optional)'),
      h('button', {
        disabled: saving || selected.length === 0,
        onClick: () => onConfirm(selected, file),
        style: { backgroundColor: colors.greenInk, color: colors.paperLight, opacity: (saving || selected.length === 0) ? 0.6 : 1 },
        className: 'w-full rounded-md py-2.5 text-sm font-medium'
      }, saving ? 'Saving\u2026' : ('Confirm paid (' + selected.length + ' month' + (selected.length !== 1 ? 's' : '') + ')'))
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
